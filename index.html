<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Track tardiness, attendance, fines, and ambagan for any event.">
  <title>Tardiness Tracker System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
  /* ── TOKENS ─────────────────────────────────────────── */
  :root {
    color-scheme: light dark;
    --red:#d7263d; --red-hover:#bb1e31; --red-light:rgba(215,38,61,.08); --on-red:#fff;
    --bg:#fff; --ink:#1d1517; --muted:#7a6c6f;
    --card:linear-gradient(150deg,rgba(255,255,255,.68),rgba(255,255,255,.34));
    --card-edge:rgba(255,255,255,.80); --field:rgba(255,255,255,.60);
    --line:rgba(70,20,28,.09); --track:rgba(120,60,70,.10);
    --shadow:0 12px 36px rgba(190,40,58,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);
    --glow-a:rgba(255,82,96,.34); --glow-b:rgba(255,168,138,.38); --glow-c:rgba(255,110,150,.26);
    --ok:#17835a; --ok-tint:rgba(23,131,90,.12);
    --warn:#9a5800; --warn-tint:rgba(214,140,20,.16);
    --bad:#b3162b; --bad-tint:rgba(179,22,43,.11);
    --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0f0a0b; --ink:#f5efef; --muted:#a89296;
    --card:linear-gradient(150deg,rgba(40,18,22,.72),rgba(28,10,14,.55));
    --card-edge:rgba(255,255,255,.07); --field:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09); --track:rgba(255,255,255,.07);
    --shadow:0 12px 36px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.30);
    --glow-a:rgba(215,38,61,.20); --glow-b:rgba(180,60,80,.16); --glow-c:rgba(200,40,60,.13);
    --red-light:rgba(215,38,61,.14);
    --ok:#34c77b; --ok-tint:rgba(52,199,123,.14);
    --warn:#f0a020; --warn-tint:rgba(240,160,32,.15);
    --bad:#ff4d63; --bad-tint:rgba(255,77,99,.14);
  }}
  /* ── RESET ──────────────────────────────────────────── */
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
    padding-block:24px 48px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-top:max(24px,env(safe-area-inset-top,0px));
    min-height:100svh;}
  img{max-width:100%;}
  button,input,textarea{font-family:inherit;}
  /* ── GLOW ───────────────────────────────────────────── */
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .glow i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;}
  .glow i:nth-child(1){width:60vw;height:60vw;min-width:300px;min-height:300px;left:-18vw;top:-10vh;background:var(--glow-a);}
  .glow i:nth-child(2){width:58vw;height:58vw;min-width:300px;min-height:300px;right:-20vw;top:30vh;background:var(--glow-b);}
  .glow i:nth-child(3){width:50vw;height:50vw;min-width:260px;min-height:260px;left:0;bottom:-14vh;background:var(--glow-c);}
  /* ── LAYOUT ─────────────────────────────────────────── */
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  /* ── CARD ───────────────────────────────────────────── */
  .card{background:var(--card);-webkit-backdrop-filter:blur(32px) saturate(200%);backdrop-filter:blur(32px) saturate(200%);will-change:backdrop-filter;border:1px solid var(--card-edge);border-radius:28px;box-shadow:var(--shadow);padding:20px 18px;}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card-enter{animation:cardIn .35s cubic-bezier(.22,1,.36,1) both;}
  @media(prefers-reduced-motion:reduce){.card-enter{animation:none;}}
  /* ── TYPE ───────────────────────────────────────────── */
  h1{font-size:1.75rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;}
  h1 span{color:var(--red);}
  .lede{margin:8px 0 0;color:var(--muted);font-size:.95rem;line-height:1.6;}
  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px;}
  /* ── FORM ───────────────────────────────────────────── */
  .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px;}
  .form .wide{grid-column:1/-1;}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .field label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .field input{-webkit-appearance:none;appearance:none;display:block;font-size:1rem;color:var(--ink);width:100%;min-width:0;max-width:100%;min-height:48px;background:var(--field);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 3px rgba(120,40,50,.10);border-radius:16px;padding:0 14px;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;}
  .field input[type="date"],.field input[type="time"]{line-height:48px;text-align:left;margin:0;}
  input::-webkit-date-and-time-value{text-align:left;min-height:1.2em;}
  input::-webkit-datetime-edit{padding:0;}
  .field input:focus{border-color:rgba(215,38,61,.45);box-shadow:inset 0 1px 3px rgba(120,40,50,.10),0 0 0 3px rgba(215,38,61,.12);outline:none;}
  @media(prefers-color-scheme:dark){.field input{border-color:rgba(255,255,255,.10);}.field input:focus{border-color:rgba(215,38,61,.55);}}
  .field .hint{font-size:.8rem;color:var(--muted);line-height:1.5;}
  /* ── BUTTONS ────────────────────────────────────────── */
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:1rem;cursor:pointer;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.62);box-shadow:0 2px 10px rgba(160,40,55,.10),inset 0 1px 0 #fff;color:var(--ink);transition:background .2s,box-shadow .2s,transform .15s,color .15s;-webkit-tap-highlight-color:transparent;}
  .btn:hover{background:var(--red-light);box-shadow:0 4px 14px rgba(160,40,55,.14),inset 0 1px 0 #fff;color:var(--red);}
  .btn:active{transform:scale(.97);}
  @media(prefers-color-scheme:dark){
    .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.10);box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);}
    .btn:hover{background:var(--red-light);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);color:#ff7080;}
  }
  .btn.primary{background:linear-gradient(170deg,#ee4559,var(--red));color:var(--on-red);border-color:rgba(255,255,255,.30);box-shadow:0 8px 22px rgba(215,38,61,.35),inset 0 1px 0 rgba(255,255,255,.40);}
  .btn.primary:hover{background:linear-gradient(170deg,#f55369,#c42038);color:var(--on-red);box-shadow:0 10px 28px rgba(215,38,61,.45),inset 0 1px 0 rgba(255,255,255,.40);transform:translateY(-1px);}
  .btn.primary:active{transform:scale(.97) translateY(0);}
  .btn.quiet{background:transparent;color:var(--muted);border-color:transparent;box-shadow:none;}
  .btn.quiet:hover{background:var(--red-light);color:var(--red);box-shadow:none;}
  .btn.small{min-height:40px;font-size:.9rem;padding:0 16px;}
  .btn.block{width:100%;}
  .form .btn.primary{grid-column:1/-1;margin-top:4px;}
  /* ── TOP LINE ───────────────────────────────────────── */
  .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;}
  .topline .who-event{min-width:0;}
  .topline strong{display:block;font-size:1.1rem;font-weight:700;overflow-wrap:anywhere;}
  .topline span{color:var(--muted);font-size:.88rem;}
  /* ── CLOCK ──────────────────────────────────────────── */
  .clock{position:relative;overflow:hidden;text-align:center;padding:24px 16px 22px;}
  .clock::before{content:"";position:absolute;inset:0 0 auto 0;height:55%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;}
  @media(prefers-color-scheme:dark){.clock::before{background:linear-gradient(180deg,rgba(40,15,18,.5),rgba(40,15,18,0));}}
  .clock>*{position:relative;}
  .chip{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:999px;}
  .chip.before{background:var(--ok-tint);color:var(--ok);}
  .chip.grace{background:var(--warn-tint);color:var(--warn);}
  .chip.late{background:var(--bad-tint);color:var(--bad);}
  .clock .lab{margin:14px 0 0;color:var(--muted);font-size:.92rem;}
  .clock .big{margin:4px 0 0;font-family:var(--font-num);font-weight:600;font-size:clamp(2.1rem,11vw,3.1rem);line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .clock .sub{margin:8px 0 0;color:var(--muted);font-size:.88rem;}
  /* ── TAB SWITCHER ───────────────────────────────────── */
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:14px;padding:3px;}
  .tab-btn{font-size:.9rem;font-weight:600;min-height:44px;padding:0 12px;border-radius:11px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
  .tab-btn[aria-selected="true"]{background:linear-gradient(170deg,#ee4559,var(--red));color:#fff;box-shadow:0 2px 8px rgba(215,38,61,.32),inset 0 1px 0 rgba(255,255,255,.28);}
  /* ── TAB PANELS ─────────────────────────────────────── */
  .tab-panel{display:flex;flex-direction:column;gap:16px;}
  .tab-panel[hidden]{display:none;}
  /* ── ATTENDANCE SUMMARY ──────────────────────────────── */
  .summary{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;padding:0 4px 12px;border-bottom:1px solid var(--line);font-size:.92rem;}
  .counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);}
  .counts b{font-weight:700;font-variant-numeric:tabular-nums;}
  .counts .c-ok b{color:var(--ok);} .counts .c-late b{color:var(--warn);} .counts .c-abs b{color:var(--bad);}
  .total{font-weight:700;font-variant-numeric:tabular-nums;}
  .total.due{color:var(--bad);} .total.none{color:var(--muted);font-weight:500;}
  /* ── ATTENDANCE LIST ─────────────────────────────────── */
  h2{margin:18px 4px 4px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .name{font-weight:600;letter-spacing:.01em;overflow-wrap:anywhere;}
  .pick{display:grid;grid-template-columns:repeat(3,58px);padding:3px;border-radius:14px;background:var(--track);box-shadow:inset 0 1px 2px rgba(120,40,50,.10);}
  .pick button{font-size:.8rem;font-weight:600;cursor:pointer;min-height:44px;padding:0 2px;border-radius:11px;border:0;background:transparent;color:var(--muted);transition:background .18s,color .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent;}
  .pick button:hover:not([aria-pressed="true"]){background:rgba(215,38,61,.10);color:var(--red);}
  .pick button[aria-pressed="true"]{box-shadow:0 2px 6px rgba(80,20,30,.20),0 0 0 .5px rgba(80,20,30,.06),inset 0 1px 0 #fff;}
  @media(prefers-color-scheme:dark){.pick button[aria-pressed="true"]{box-shadow:0 2px 8px rgba(0,0,0,.40),0 0 0 .5px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.06);}}
  .pick button[aria-pressed="true"].present{background:linear-gradient(var(--ok-tint),var(--ok-tint)),#fff;color:var(--ok);}
  .pick button[aria-pressed="true"].late{background:linear-gradient(var(--warn-tint),var(--warn-tint)),#fff;color:var(--warn);}
  .pick button[aria-pressed="true"].absent{background:linear-gradient(var(--bad-tint),var(--bad-tint)),#fff;color:var(--bad);}
  @media(prefers-color-scheme:dark){
    .pick button[aria-pressed="true"].present{background:var(--ok-tint);}
    .pick button[aria-pressed="true"].late{background:var(--warn-tint);}
    .pick button[aria-pressed="true"].absent{background:var(--bad-tint);}
  }
  /* ── MONEY CARD ─────────────────────────────────────── */
  .money{display:flex;flex-direction:column;gap:16px;}
  .amts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .amt{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 14px;background:var(--field);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 3px rgba(120,40,50,.10);border-radius:20px;transition:border-color .2s,box-shadow .2s;}
  .amt:focus-within{border-color:rgba(215,38,61,.45);box-shadow:inset 0 1px 3px rgba(120,40,50,.10),0 0 0 3px rgba(215,38,61,.12);}
  @media(prefers-color-scheme:dark){.amt{border-color:rgba(255,255,255,.10);}.amt:focus-within{border-color:rgba(215,38,61,.55);}}
  .amt span{color:var(--muted);font-weight:600;font-size:1.1rem;}
  .amt input{-webkit-appearance:none;appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--font-num);font-weight:600;font-size:1.3rem;width:100%;min-width:0;max-width:100%;box-sizing:border-box;padding:0;outline:none;}
  .calc{display:flex;flex-direction:column;gap:6px;font-size:.95rem;}
  .calc div{display:flex;justify-content:space-between;gap:12px;}
  .calc em{font-style:normal;color:var(--muted);font-size:.85rem;}
  .calc b{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;}
  .calc .sum{padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:1.05rem;}
  .calc .sum b{color:var(--red);}
  .note{color:var(--muted);font-size:.82rem;line-height:1.6;}
  /* ── FOOTER ─────────────────────────────────────────── */
  .foot{display:flex;flex-wrap:wrap;gap:8px;}
  .foot .primary{flex:1 1 160px;}
  textarea{width:100%;min-height:170px;font:inherit;font-size:.9rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;}
  /* ── TOAST ──────────────────────────────────────────── */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);z-index:20;padding:10px 20px;border-radius:999px;background:rgba(29,21,23,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:calc(100vw - 32px);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(prefers-color-scheme:dark){.toast{background:rgba(215,38,61,.88);}}
  /* ── AMBAGAN: STAT GRID ──────────────────────────────── */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .stat-box{background:var(--field);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
  .stat-label{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .stat-value{font-family:var(--font-num);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat-box.s-ok .stat-value{color:var(--ok);}
  .stat-box.s-bad .stat-value{color:var(--bad);}
  /* ── AMBAGAN: FILTER CHIPS ───────────────────────────── */
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .fchip{font-size:.8rem;font-weight:600;padding:0 14px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}
  .fchip[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red);}
  .fchip:hover:not([aria-pressed="true"]){background:var(--red-light);color:var(--red);border-color:var(--red);}
  /* ── AMBAGAN: STATUS PILLS ───────────────────────────── */
  .pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
  .pill.paid{background:var(--ok-tint);color:var(--ok);}
  .pill.partial{background:var(--warn-tint);color:var(--warn);}
  .pill.unpaid{background:var(--bad-tint);color:var(--bad);}
  .pill.nodues{background:var(--track);color:var(--muted);}
  /* ── AMBAGAN: ROWS ───────────────────────────────────── */
  .amb-row{padding:12px 4px;border-bottom:1px solid var(--line);}
  .amb-row:last-child{border-bottom:0;}
  .amb-top{display:flex;align-items:center;gap:8px;margin-bottom:0;}
  .amb-name{flex:1 1 0;min-width:0;font-weight:600;overflow-wrap:anywhere;}
  .amb-due{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:.92rem;flex-shrink:0;}
  .amb-bot{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .amb-bot .amt{flex:1 1 0;min-width:0;min-height:44px;border-radius:14px;}
  .amb-bot .amt input{font-size:1.1rem;}
  .amb-empty{color:var(--muted);font-size:.9rem;padding:16px 4px;text-align:center;}
  /* ── RESPONSIVE ─────────────────────────────────────── */
  @media(max-width:380px){
    .pick{grid-template-columns:repeat(3,50px);}.pick button{font-size:.74rem;}
    .amts{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
  }
  @media(prefers-reduced-motion:reduce){.toast,.card-enter,.btn,.pick button,.field input,.amt,.tab-btn,.fchip{transition:none;animation:none;}}
  </style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="wrap">
  <!-- ═══ SCREEN 1: SETUP ═══ -->
  <section id="screen-setup" class="card" aria-labelledby="setupTitle">
    <h1 id="setupTitle">Tardiness <span>Tracker</span></h1>
    <p class="lede" id="setupDesc">Set the event details. Anyone arriving after the call time plus grace period counts as late.</p>
    <form class="form" id="setupForm" aria-describedby="setupDesc">
      <div class="field wide"><label for="eventName">Event name</label><input type="text" id="eventName" autocomplete="off" required></div>
      <div class="field"><label for="eventDate">Date</label><input type="date" id="eventDate" required></div>
      <div class="field"><label for="callTime">Call time</label><input type="time" id="callTime" required></div>
      <div class="field wide">
        <label for="grace">Grace period (minutes)</label>
        <input type="number" id="grace" min="0" max="180" step="1" inputmode="numeric" required aria-describedby="graceHint">
        <span class="hint" id="graceHint">Use 0 for no grace period.</span>
      </div>
      <button type="submit" class="btn primary">Start</button>
    </form>
  </section>

  <!-- ═══ SCREEN 2: RUN ═══ -->
  <div id="screen-run" hidden>
    <div class="wrap">

      <!-- Always-visible header -->
      <div class="topline">
        <div class="who-event"><strong id="evName"></strong><span id="evDate"></span></div>
        <button type="button" class="btn small" data-action="edit">Edit info</button>
      </div>

      <!-- Always-visible countdown -->
      <section class="card clock" aria-label="Countdown to call time">
        <span class="chip before" id="chip">Before call time</span>
        <p class="lab" id="clockLab"></p>
        <p class="big" id="clockBig" role="timer">--:--:--</p>
        <p class="sub" id="clockSub"></p>
      </section>

      <!-- Tab switcher -->
      <div class="tabs" role="tablist">
        <button id="tab-attendance" class="tab-btn" role="tab" aria-selected="true"  aria-controls="panel-attendance" data-tab="attendance">Attendance</button>
        <button id="tab-ambagan"    class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-ambagan"    data-tab="ambagan">Ambagan</button>
      </div>

      <!-- ─── PANEL: ATTENDANCE ─── -->
      <div id="panel-attendance" class="tab-panel" role="tabpanel" aria-labelledby="tab-attendance">
        <section class="card" aria-label="Attendance">
          <div class="summary"><div class="counts" id="counts"></div><div class="total" id="total"></div></div>
          <div id="list"></div>
        </section>
        <section class="card money" aria-labelledby="moneyTitle">
          <div class="eyebrow" id="moneyTitle">Ambagan and fines</div>
          <div class="amts">
            <div class="field"><label for="ambagan">Ambagan per person</label><div class="amt"><span>&#8369;</span><input type="number" id="ambagan" min="0" step="5" inputmode="decimal" placeholder="0"></div></div>
            <div class="field"><label for="fine">Fine, late or absent</label><div class="amt"><span>&#8369;</span><input type="number" id="fine" min="0" step="10" inputmode="decimal" placeholder="0"></div></div>
          </div>
          <div class="calc" id="calc"></div>
          <p class="note">Ambagan counts everyone marked On time or Late.</p>
        </section>
        <div class="foot">
          <button class="btn primary" data-action="copy">Copy summary</button>
          <button class="btn"         data-action="fill">Rest on time</button>
          <button class="btn quiet"   data-action="clear">Clear</button>
        </div>
        <textarea id="out" readonly hidden aria-label="Summary text"></textarea>
      </div>

      <!-- ─── PANEL: AMBAGAN ─── -->
      <div id="panel-ambagan" class="tab-panel" role="tabpanel" aria-labelledby="tab-ambagan" hidden>
        <section class="card" aria-label="Ambagan summary">
          <div id="amb-summary"></div>
        </section>
        <section class="card" aria-label="Payment details">
          <div id="amb-list"></div>
        </section>
        <textarea id="out-amb" readonly hidden aria-label="Ambagan summary text"></textarea>
      </div>

    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  /* ── CONSTANTS ───────────────────────────────────────── */
  var TRACK_FACULTY = true; // set false to exclude faculty from ambagan
  var KEY  = "tardiness-tracker-v4";
  var PESO = "₱";
  var STUDENTS = ["MARGAUX","FRENCHIE","MJ","DEXTER","KIRK","KING","KIRSTEN","JUSTINE","JAZMINE","JC","ALLAN","GLYCEL","CASEY","CHLOE","ERICA","JADE","RAFA","YESHA","AIESHA","TRICIA","LAURICE","RHENOA","KRISTINE","VANCE","JAMES","VINCENT","JK"];
  var FACULTY  = ["ENGR. MUSNI","ENGR. KLEO","ENGR. BARRA","ENGR. NEIL","ENGR. CLARK"];
  function pad(n){ return String(n).padStart(2,"0"); }
  var GROUPS = [
    { title:"Students", people: STUDENTS.map(function(n,i){ return { id:"S"+pad(i+1), name:n }; }) },
    { title:"Faculty",  people: FACULTY.map( function(n,i){ return { id:"F"+pad(i+1), name:n }; }) }
  ];
  var ALL = GROUPS[0].people.concat(GROUPS[1].people);
  var AMB_ROSTER = TRACK_FACULTY ? ALL : GROUPS[0].people;

  /* ── STATE ───────────────────────────────────────────── */
  var d = new Date();
  var state = {
    screen:"setup", tab:"attendance", filter:"all",
    cfg:{ eventName:"Dance Practice", eventDate:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()), callTime:"08:00", grace:5, fine:100, ambagan:0 },
    marks:{}, payments:{}
  };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s.cfg)      Object.assign(state.cfg, s.cfg);
      if (s.marks)    state.marks    = s.marks;
      if (s.payments) state.payments = s.payments;
      if (s.screen === "run" || s.screen === "setup") state.screen = s.screen;
      if (s.tab    === "attendance" || s.tab === "ambagan") state.tab = s.tab;
    }
  } catch(e){}

  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function peso(n){ return PESO+Number(n).toLocaleString("en-PH",{maximumFractionDigits:2}); }
  function num(v){ return Math.max(0,Number(v)||0); }
  function fmtClock(ms){ return new Date(ms).toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit"}); }
  function fmtTime(t){ if(!t)return""; var p=t.split(":"),h=parseInt(p[0],10); return((h%12)||12)+":"+p[1]+" "+(h>=12?"PM":"AM"); }
  function fmtDate(x){ if(!x)return""; var p=x.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"}); }
  function callMs(){ var p=(state.cfg.eventDate||"").split("-"),t=(state.cfg.callTime||"").split(":"); if(p.length<3||t.length<2)return null; return new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1],0).getTime(); }
  function graceMs(){ return num(state.cfg.grace)*60000; }
  function fmtDur(ms){ var s=Math.floor(Math.max(0,ms)/1000),dd=Math.floor(s/86400); s%=86400; var h=Math.floor(s/3600); s%=3600; var m=Math.floor(s/60); s%=60; return(dd?dd+"d ":"")+pad(h)+":"+pad(m)+":"+pad(s); }

  /* ── AMBAGAN HELPERS ─────────────────────────────────── */
  function dueFn(id){
    var m=state.marks[id], amb=num(state.cfg.ambagan), fine=num(state.cfg.fine);
    if(m==="present") return amb;
    if(m==="late")    return amb+fine;
    if(m==="absent")  return fine;
    return 0;
  }
  function paidFn(id){ return Math.max(0,Number(state.payments[id])||0); }
  function balanceFn(id){ return Math.max(0,dueFn(id)-paidFn(id)); }
  function statusFn(id){
    var due=dueFn(id); if(!due)return"nodues";
    var paid=paidFn(id); if(paid>=due)return"paid"; if(paid>0)return"partial"; return"unpaid";
  }
  var PILLS={ paid:["Paid","pill paid"], partial:["Partial","pill partial"], unpaid:["Unpaid","pill unpaid"], nodues:["No dues","pill nodues"] };

  /* ── CLOCK ───────────────────────────────────────────── */
  function tick(){
    if(state.screen!=="run")return;
    var call=callMs(), chip=$("chip");
    if(call===null){$("clockBig").textContent="--:--:--";$("clockLab").textContent="Set a call time";$("clockSub").textContent="";return;}
    var now=Date.now(), cut=call+graceMs(), g=state.cfg.grace>0;
    if(now<call){ chip.className="chip before";chip.textContent="Before call time";$("clockLab").textContent="Call time in";$("clockBig").textContent=fmtDur(call-now); }
    else if(now<cut){ chip.className="chip grace";chip.textContent="Grace period";$("clockLab").textContent="Grace period ends in";$("clockBig").textContent=fmtDur(cut-now); }
    else{ chip.className="chip late";chip.textContent="Late";$("clockLab").textContent="Late by";$("clockBig").textContent=fmtDur(now-cut); }
    $("clockSub").textContent="Call time "+fmtClock(call)+(g?" · Late after "+fmtClock(cut):"");
  }

  /* ── ATTENDANCE RENDERS ──────────────────────────────── */
  function counts(){ var c={present:0,late:0,absent:0}; ALL.forEach(function(p){var m=state.marks[p.id];if(m)c[m]++;}); return c; }
  function renderHeader(){ $("evName").textContent=state.cfg.eventName||"Untitled event"; $("evDate").textContent=fmtDate(state.cfg.eventDate); }
  function renderSummary(){
    var c=counts(), fines=(c.late+c.absent)*num(state.cfg.fine);
    $("counts").innerHTML='<span class="c-ok"><b>'+c.present+'</b> on time</span><span class="c-late"><b>'+c.late+'</b> late</span><span class="c-abs"><b>'+c.absent+'</b> absent</span>';
    var t=$("total"); t.textContent=fines?"Fines "+peso(fines):"No fines"; t.className="total "+(fines?"due":"none");
  }
  function renderMoney(){
    var c=counts(), fine=num(state.cfg.fine), amb=num(state.cfg.ambagan), nf=c.late+c.absent, na=c.present+c.late;
    $("calc").innerHTML='<div><span>Fines <em>'+nf+' × '+peso(fine)+'</em></span><b>'+peso(nf*fine)+'</b></div>'+'<div><span>Ambagan <em>'+na+' × '+peso(amb)+'</em></span><b>'+peso(na*amb)+'</b></div>'+'<div class="sum"><span>Total to collect</span><b>'+peso(nf*fine+na*amb)+'</b></div>';
  }
  function renderList(){
    $("list").innerHTML=GROUPS.map(function(g){
      return'<h2>'+g.title+'</h2>'+g.people.map(function(p){
        var m=state.marks[p.id]||"";
        function b(k,label){ return'<button type="button" class="'+k+'" data-id="'+p.id+'" data-mark="'+k+'" aria-pressed="'+(m===k)+'">'+label+'</button>'; }
        return'<div class="row"><div class="name">'+esc(p.name)+'</div><div class="pick" role="group" aria-label="'+esc(p.name)+'">'+b("present","On time")+b("late","Late")+b("absent","Absent")+'</div></div>';
      }).join("");
    }).join("");
  }
  function updateRow(id){ document.querySelectorAll('button[data-id="'+id+'"]').forEach(function(b){ b.setAttribute("aria-pressed",String(state.marks[id]===b.getAttribute("data-mark"))); }); }

  /* ── AMBAGAN RENDERS ─────────────────────────────────── */
  function ambTotals(){
    var due=0, coll=0, paid=0, owing=0;
    AMB_ROSTER.forEach(function(p){
      var d=dueFn(p.id), py=paidFn(p.id), bal=Math.max(0,d-py);
      due+=d; coll+=Math.min(py,d);
      if(d>0){ owing++; if(bal===0) paid++; }
    });
    return{ due:due, coll:coll, out:due-coll, paid:paid, owing:owing };
  }
  function sbox(label,val,cls){ return'<div class="stat-box '+cls+'"><span class="stat-label">'+label+'</span><span class="stat-value">'+val+'</span></div>'; }

  function renderAmbaganSummary(){
    var el=$("amb-summary"); if(!el)return;
    var t=ambTotals();
    el.innerHTML=
      '<div class="stat-grid">'+
        sbox("Total due",   peso(t.due),  "")+
        sbox("Collected",   peso(t.coll), t.coll>0?"s-ok":"")+
        sbox("Outstanding", peso(t.out),  t.out>0?"s-bad":"s-ok")+
        sbox("Fully paid",  t.paid+" of "+t.owing, "")+
      '</div>'+
      '<div class="filter-chips" role="group" aria-label="Filter">'+
        ['all','unpaid','paid'].map(function(f){ return'<button class="fchip" data-filter="'+f+'" aria-pressed="'+(state.filter===f)+'">'+{all:"All",unpaid:"Unpaid",paid:"Paid"}[f]+'</button>'; }).join("")+
      '</div>'+
      '<button class="btn primary block" data-aaction="copy-amb">Copy summary</button>';
  }

  function filteredRoster(){
    return AMB_ROSTER.filter(function(p){
      var st=statusFn(p.id);
      if(state.filter==="unpaid") return st==="unpaid"||st==="partial";
      if(state.filter==="paid")   return st==="paid";
      return true;
    });
  }

  function ambRowHtml(p){
    var due=dueFn(p.id), paid=paidFn(p.id), st=statusFn(p.id), pm=PILLS[st], hasDue=due>0;
    return'<div class="amb-row">'+
      '<div class="amb-top">'+
        '<span class="amb-name">'+esc(p.name)+'</span>'+
        '<span class="amb-due" id="adue-'+p.id+'">'+(hasDue?peso(due):"—")+'</span>'+
        '<span class="'+pm[1]+'" id="apill-'+p.id+'">'+pm[0]+'</span>'+
      '</div>'+
      (hasDue?
        '<div class="amb-bot" id="abot-'+p.id+'">'+
          '<div class="amt"><span>₱</span><input type="number" id="apay-'+p.id+'" data-aid="'+p.id+'" min="0" step="5" inputmode="decimal" placeholder="0"'+(paid?' value="'+paid+'"':'')+' aria-label="Paid by '+esc(p.name)+'"></div>'+
          (st!=="paid"?'<button type="button" class="btn small" data-aaction="full" data-aid="'+p.id+'">Pay all</button>':'')+
        '</div>'
      :'')+
    '</div>';
  }

  function renderAmbaganList(){
    var el=$("amb-list"); if(!el)return;
    var roster=filteredRoster();
    el.innerHTML=roster.length?roster.map(ambRowHtml).join(""):'<p class="amb-empty">No one matches this filter.</p>';
  }

  function updateAmbaganRow(id){
    var dueEl=$("adue-"+id), pillEl=$("apill-"+id), botEl=$("abot-"+id); if(!dueEl)return;
    var due=dueFn(id), st=statusFn(id), pm=PILLS[st];
    dueEl.textContent  = due?peso(due):"—";
    pillEl.textContent = pm[0]; pillEl.className=pm[1];
    if(botEl){
      var btn=botEl.querySelector('[data-aaction="full"]');
      if(st==="paid"&&btn) btn.remove();
      if(st!=="paid"&&!btn){
        var nb=document.createElement("button"); nb.type="button"; nb.className="btn small";
        nb.setAttribute("data-aaction","full"); nb.setAttribute("data-aid",id); nb.textContent="Pay all";
        botEl.appendChild(nb);
      }
    }
  }

  function renderAmbagan(){ renderAmbaganSummary(); renderAmbaganList(); }

  /* ── TAB & FILTER ──────────────────────────────────── */
  function switchTab(tab){
    state.tab=tab; persist();
    $("tab-attendance").setAttribute("aria-selected",String(tab==="attendance"));
    $("tab-ambagan").setAttribute("aria-selected",String(tab==="ambagan"));
    $("panel-attendance").hidden=tab!=="attendance";
    $("panel-ambagan").hidden=tab!=="ambagan";
    if(tab==="ambagan") renderAmbagan();
  }
  function setFilter(f){ state.filter=f; renderAmbaganSummary(); renderAmbaganList(); }

  /* ── RENDER ALL ──────────────────────────────────────── */
  function renderAll(){ renderHeader(); renderSummary(); renderMoney(); renderList(); tick(); renderAmbaganSummary(); }

  /* ── SCREEN SWITCH ───────────────────────────────────── */
  function animateCards(){ document.querySelectorAll("#screen-run .card").forEach(function(el,i){ el.classList.remove("card-enter"); void el.offsetWidth; el.style.animationDelay=(i*60)+"ms"; el.classList.add("card-enter"); }); }
  function showScreen(name){
    state.screen=name; $("screen-setup").hidden=name!=="setup"; $("screen-run").hidden=name!=="run"; persist();
    if(name==="run"){ renderAll(); switchTab(state.tab); animateCards(); }
    window.scrollTo(0,0);
  }

  /* ── TOAST ───────────────────────────────────────────── */
  var toastTimer;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },2200); }

  /* ── TEXT BUILDERS ───────────────────────────────────── */
  function nameList(key){ return ALL.filter(function(p){ return state.marks[p.id]===key; }).map(function(p){ return p.name; }); }
  function buildAttendanceSummary(){
    var late=nameList("late"),abs=nameList("absent"),ok=nameList("present");
    var un=ALL.filter(function(p){ return!state.marks[p.id]; }).map(function(p){ return p.name; });
    var fine=num(state.cfg.fine),amb=num(state.cfg.ambagan),g=num(state.cfg.grace);
    var out=[state.cfg.eventName+" – "+fmtDate(state.cfg.eventDate)];
    out.push("Call time: "+fmtTime(state.cfg.callTime)+(g?" (grace period "+g+" min)":""));
    out.push(""); out.push("LATE ("+late.length+")"); out.push(late.length?late.join(", "):"None");
    out.push(""); out.push("ABSENT ("+abs.length+")"); out.push(abs.length?abs.join(", "):"None");
    out.push(""); out.push("ON TIME ("+ok.length+")");
    if(un.length){ out.push(""); out.push("NOT MARKED ("+un.length+"): "+un.join(", ")); }
    out.push(""); out.push("Fines: "+(late.length+abs.length)+" × "+peso(fine)+" = "+peso((late.length+abs.length)*fine));
    if(amb) out.push("Ambagan: "+(ok.length+late.length)+" × "+peso(amb)+" = "+peso((ok.length+late.length)*amb));
    out.push("Total to collect: "+peso((late.length+abs.length)*fine+(ok.length+late.length)*amb));
    return out.join("\n");
  }
  function buildAmbaganSummaryText(){
    var t=ambTotals();
    var lines=[state.cfg.eventName+" – "+fmtDate(state.cfg.eventDate),"Ambagan Summary",""];
    var owing=AMB_ROSTER.filter(function(p){ return balanceFn(p.id)>0; });
    if(owing.length){
      lines.push("STILL OWING ("+owing.length+"):");
      owing.forEach(function(p){
        var due=dueFn(p.id), paid=paidFn(p.id), bal=due-paid;
        var note=paid>0?" (paid "+peso(paid)+", "+peso(bal)+" left)":"";
        lines.push("• "+p.name+" — "+peso(bal)+note);
      });
      lines.push("");
    } else { lines.push("Everyone is fully paid! 🎉"); lines.push(""); }
    var paidPpl=AMB_ROSTER.filter(function(p){ return statusFn(p.id)==="paid"; });
    if(paidPpl.length){ lines.push("FULLY PAID ("+paidPpl.length+"): "+paidPpl.map(function(p){return p.name;}).join(", ")); lines.push(""); }
    lines.push("Total due:    "+peso(t.due));
    lines.push("Collected:    "+peso(t.coll));
    lines.push("Outstanding:  "+peso(t.out));
    return lines.join("\n");
  }

  /* ── EVENTS ──────────────────────────────────────────── */
  // Setup form inputs
  $("eventName").value=state.cfg.eventName; $("eventDate").value=state.cfg.eventDate;
  $("callTime").value=state.cfg.callTime;   $("grace").value=state.cfg.grace;
  $("ambagan").value=state.cfg.ambagan||""; $("fine").value=state.cfg.fine||"";
  ["eventName","eventDate","callTime"].forEach(function(id){ $(id).addEventListener("input",function(){ state.cfg[id]=this.value; persist(); }); });
  $("grace").addEventListener("input",function(){ state.cfg.grace=num(this.value); persist(); });
  ["ambagan","fine"].forEach(function(id){
    $(id).addEventListener("input",function(){
      state.cfg[id]=num(this.value); persist();
      renderSummary(); renderMoney(); renderAmbaganSummary();
      if(state.tab==="ambagan") renderAmbaganList();
    });
  });
  $("setupForm").addEventListener("submit",function(e){ e.preventDefault(); showScreen("run"); });

  // Payment inputs (delegation on document)
  document.addEventListener("input",function(e){
    var el=e.target, aid=el.getAttribute("data-aid");
    if(aid && el.id && el.id.indexOf("apay-")===0){
      state.payments[aid]=Math.max(0,Number(el.value)||0);
      persist(); updateAmbaganRow(aid); renderAmbaganSummary();
    }
  });

  // Click delegation
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b)return;

    // Tab switching
    var dt=b.getAttribute("data-tab");
    if(dt){ switchTab(dt); return; }

    // Filter chips
    var df=b.getAttribute("data-filter");
    if(df){ setFilter(df); return; }

    // Ambagan actions
    var da=b.getAttribute("data-aaction");
    if(da==="full"){
      var fid=b.getAttribute("data-aid"), fdue=dueFn(fid);
      state.payments[fid]=fdue; persist();
      var inp=$("apay-"+fid); if(inp) inp.value=fdue;
      updateAmbaganRow(fid); renderAmbaganSummary(); return;
    }
    if(da==="copy-amb"){
      var txt=buildAmbaganSummaryText(), box=$("out-amb"); box.value=txt;
      function fb2(){ box.hidden=false; box.focus(); box.select(); toast("Select and copy the text"); }
      try{ navigator.clipboard.writeText(txt).then(function(){ toast("Summary copied ✓"); },fb2); }catch(err){ fb2(); }
      return;
    }

    // Attendance mark buttons
    var id=b.getAttribute("data-id");
    if(id){
      var k=b.getAttribute("data-mark");
      if(state.marks[id]===k) delete state.marks[id]; else state.marks[id]=k;
      persist(); updateRow(id); renderSummary(); renderMoney(); renderAmbaganSummary();
      if(state.tab==="ambagan") renderAmbaganList();
      return;
    }

    // Action buttons
    var a=b.getAttribute("data-action");
    if(a==="edit") showScreen("setup");
    else if(a==="fill"){
      ALL.forEach(function(p){ if(!state.marks[p.id]) state.marks[p.id]="present"; });
      persist(); renderList(); renderSummary(); renderMoney(); renderAmbaganSummary();
      if(state.tab==="ambagan") renderAmbaganList();
      toast("Everyone left is on time");
    } else if(a==="clear"){
      state.marks={}; persist(); renderList(); renderSummary(); renderMoney(); renderAmbaganSummary();
      if(state.tab==="ambagan") renderAmbaganList();
      $("out").hidden=true;
    } else if(a==="copy"){
      var text=buildAttendanceSummary(), box=$("out"); box.value=text;
      function fb(){ box.hidden=false; box.focus(); box.select(); toast("Select and copy the text"); }
      try{ navigator.clipboard.writeText(text).then(function(){ toast("Summary copied ✓"); },fb); }catch(err){ fb(); }
    }
  });

  setInterval(tick,1000);
  showScreen(state.screen);
  window.scrollTo(0,0);
})();
</script>
</body>
</html>
